name: ingest-and-deploy

# Two independent concerns, deliberately NOT chained with always()/needs (which skips deploy in
# subtle ways):
#   - BUILD + DEPLOY: runs on every trigger, plain success() semantics. Publishes the committed
#     data/seminars.json + web/ to Pages.
#   - INGEST: runs only on the weekly cron or an opt-in manual dispatch. Fetches sources, extracts
#     via Gemini, validates, and pushes a fresh data commit. That push then triggers this workflow
#     again (as a `push` event), which builds + deploys the new data. No [skip ci], so the data
#     actually deploys; no loop, because the follow-up run is a push (ingest is gated off for pushes).
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # weekly, Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      run_ingest:
        description: 'Run the ingest (Gemini) step (otherwise just build + deploy)'
        type: boolean
        default: false

permissions:
  contents: write # ingest commits data/seminars.json
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # BUILD + DEPLOY — every trigger. No needs/always(): plain, reliable success() gating.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate committed data before deploy (deterministic gate)
        # Fails the deploy if data/seminars.json is empty, invalid, missing required fields, or the
        # talk count collapsed vs. HEAD. No LLM here.
        run: npm run check-data
      - name: Build site
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # INGEST — cron or opt-in dispatch only. Pushes fresh data, which re-triggers build+deploy above.
  ingest:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_ingest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run ingest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: npm run ingest
      - name: Validate freshly ingested data
        run: npm run check-data
      - name: Commit + push updated data (triggers a build+deploy run)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seminars.json data/extract-cache.json
          git diff --staged --quiet || git commit -m "chore: update seminars.json"
          git push
