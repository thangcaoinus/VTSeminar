name: ingest-and-deploy

on:
  schedule:
    - cron: '0 6 * * 1' # weekly, Mondays 06:00 UTC
  workflow_dispatch: {} # allow manual runs

permissions:
  contents: write # commit updated data/seminars.json
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run ingest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: npm run ingest
      - name: Validate data before deploy (deterministic gate)
        # Blocks commit/build/deploy if seminars.json is empty, invalid, missing required fields,
        # or the talk count collapsed vs. HEAD (mass source failure). No LLM here.
        run: npm run check-data
      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seminars.json data/extract-cache.json
          git diff --staged --quiet || git commit -m "chore: update seminars.json [skip ci]"
          git push
      - name: Build site
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: ingest
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
